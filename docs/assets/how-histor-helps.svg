<svg xmlns="http://www.w3.org/2000/svg" width="880" height="752" viewBox="0 0 880 752" role="img" aria-label="How SL Histor helps: five situations, each comparing what you have without SL Histor to what you get with it">
<title>How SL Histor helps: five situations</title>
<rect width="880" height="752" rx="14" fill="#fbfaf6"></rect><g>
<rect x="16" y="16" width="848" height="123" rx="10" fill="#fffefb"></rect>
<path d="M26 16 H236 V139 H26 a10 10 0 0 1 -10 -10 V26 a10 10 0 0 1 10 -10 Z" fill="#fbd3cc"></path>
<line x1="236" y1="16" x2="236" y2="139" stroke="#18291b" stroke-width="1"></line>
<g transform="translate(32 32) scale(0.9)" fill="none" stroke="#18291b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></g>
<text x="222" y="47" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#18291b">01</text>
<text x="32" y="84" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#18291b">Did an agent touch</text><text x="32" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#18291b">production?</text>
<text x="252" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5c6a60">WITHOUT</text>
<text x="252" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#34443a">Search logs the agent's own</text><text x="252" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#34443a">system wrote.</text>
<line x1="468" y1="77.5" x2="488" y2="77.5" fill="none" stroke="#18291b" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"></animate></line>
<path d="M483 73.5 L489 77.5 L483 81.5" fill="none" stroke="#18291b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
<rect x="494" y="24" width="362" height="107" rx="7" fill="#1d4424"></rect>
<path d="M508 41 l3.5 3.5 l7 -8" fill="none" stroke="#9fdb9b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="526" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#9fdb9b">WITH SL HISTOR</text>
<text x="508" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">Every tool call through the MCP proxy is</text><text x="508" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">a signed record, with no change to your</text><text x="508" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">tool servers.</text>
<rect x="16.8" y="16.8" width="846.4" height="121.4" rx="9.5" fill="none" stroke="#18291b" stroke-width="1.5" stroke-dasharray="6 5"></rect>
</g><g>
<rect x="16" y="151" width="848" height="142" rx="10" fill="#fffefb"></rect>
<path d="M26 151 H236 V293 H26 a10 10 0 0 1 -10 -10 V161 a10 10 0 0 1 10 -10 Z" fill="#cdeccb"></path>
<line x1="236" y1="151" x2="236" y2="293" stroke="#18291b" stroke-width="1"></line>
<g transform="translate(32 167) scale(0.9)" fill="none" stroke="#18291b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="m16 11 2 2 4-4"/></g>
<text x="222" y="182" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#18291b">02</text>
<text x="32" y="219" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#18291b">Who approved that?</text>
<text x="252" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5c6a60">WITHOUT</text>
<text x="252" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#34443a">A chat message or a ticket</text><text x="252" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#34443a">comment.</text>
<line x1="468" y1="222" x2="488" y2="222" fill="none" stroke="#18291b" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"></animate></line>
<path d="M483 218 L489 222 L483 226" fill="none" stroke="#18291b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
<rect x="494" y="159" width="362" height="126" rx="7" fill="#1d4424"></rect>
<path d="M508 176 l3.5 3.5 l7 -8" fill="none" stroke="#9fdb9b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="526" y="181" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#9fdb9b">WITH SL HISTOR</text>
<text x="508" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">A risky action waits for a human</text><text x="508" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">approval tied to that exact action,</text><text x="508" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">usable once, and never by the person who</text><text x="508" y="260" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">asked.</text>
<rect x="16.8" y="151.8" width="846.4" height="140.4" rx="9.5" fill="none" stroke="#18291b" stroke-width="1.5" stroke-dasharray="6 5"></rect>
</g><g>
<rect x="16" y="305" width="848" height="161" rx="10" fill="#fffefb"></rect>
<path d="M26 305 H236 V466 H26 a10 10 0 0 1 -10 -10 V315 a10 10 0 0 1 10 -10 Z" fill="#fbe4b0"></path>
<line x1="236" y1="305" x2="236" y2="466" stroke="#18291b" stroke-width="1"></line>
<g transform="translate(32 321) scale(0.9)" fill="none" stroke="#18291b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="222" y="336" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#18291b">03</text>
<text x="32" y="373" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#18291b">Prove nobody</text><text x="32" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#18291b">edited the record</text>
<text x="252" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5c6a60">WITHOUT</text>
<text x="252" y="357" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#34443a">Trust the log's owner.</text>
<line x1="468" y1="385.5" x2="488" y2="385.5" fill="none" stroke="#18291b" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"></animate></line>
<path d="M483 381.5 L489 385.5 L483 389.5" fill="none" stroke="#18291b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
<rect x="494" y="313" width="362" height="145" rx="7" fill="#1d4424"></rect>
<path d="M508 330 l3.5 3.5 l7 -8" fill="none" stroke="#9fdb9b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="526" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#9fdb9b">WITH SL HISTOR</text>
<text x="508" y="357" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">Edits, deletions, reordering and</text><text x="508" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">replayed approvals are detected; an</text><text x="508" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">auditor verifies offline with public</text><text x="508" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">keys, even in a browser with nothing</text><text x="508" y="433" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">uploaded.</text>
<rect x="16.8" y="305.8" width="846.4" height="159.4" rx="9.5" fill="none" stroke="#18291b" stroke-width="1.5" stroke-dasharray="6 5"></rect>
</g><g>
<rect x="16" y="478" width="848" height="123" rx="10" fill="#fffefb"></rect>
<path d="M26 478 H236 V601 H26 a10 10 0 0 1 -10 -10 V488 a10 10 0 0 1 10 -10 Z" fill="#cfe0fb"></path>
<line x1="236" y1="478" x2="236" y2="601" stroke="#18291b" stroke-width="1"></line>
<g transform="translate(32 494) scale(0.9)" fill="none" stroke="#18291b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="5"/><circle cx="16" cy="12" r="5"/><path d="m12.5 8.5 7 7"/></g>
<text x="222" y="509" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#18291b">04</text>
<text x="32" y="546" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#18291b">The retry that</text><text x="32" y="568" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#18291b">pays twice</text>
<text x="252" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5c6a60">WITHOUT</text>
<text x="252" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#34443a">A crashed agent session</text><text x="252" y="549" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#34443a">restarts and the same $500</text><text x="252" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#34443a">transfer runs twice.</text>
<line x1="468" y1="539.5" x2="488" y2="539.5" fill="none" stroke="#18291b" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"></animate></line>
<path d="M483 535.5 L489 539.5 L483 543.5" fill="none" stroke="#18291b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
<rect x="494" y="486" width="362" height="107" rx="7" fill="#1d4424"></rect>
<path d="M508 503 l3.5 3.5 l7 -8" fill="none" stroke="#9fdb9b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="526" y="508" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#9fdb9b">WITH SL HISTOR</text>
<text x="508" y="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">The retried call is refused as “approval</text><text x="508" y="549" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">already used”; the transfer happens</text><text x="508" y="568" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">once.</text>
<rect x="16.8" y="478.8" width="846.4" height="121.4" rx="9.5" fill="none" stroke="#18291b" stroke-width="1.5" stroke-dasharray="6 5"></rect>
</g><g>
<rect x="16" y="613" width="848" height="123" rx="10" fill="#fffefb"></rect>
<path d="M26 613 H236 V736 H26 a10 10 0 0 1 -10 -10 V623 a10 10 0 0 1 10 -10 Z" fill="#e7f6e6"></path>
<line x1="236" y1="613" x2="236" y2="736" stroke="#18291b" stroke-width="1"></line>
<g transform="translate(32 629) scale(0.9)" fill="none" stroke="#18291b" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18l2-1.5L9 21l2-1.5L13 21l2-1.5L17 21l2-1.5V3l-2 1.5L15 3l-2 1.5L11 3 9 4.5 7 3 5 4.5z"/><path d="M9 9h6M9 13h6"/></g>
<text x="222" y="644" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#18291b">05</text>
<text x="32" y="681" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#18291b">What did that</text><text x="32" y="703" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#18291b">agent really cost?</text>
<text x="252" y="643" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#5c6a60">WITHOUT</text>
<text x="252" y="665" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#34443a">A naive estimate that</text><text x="252" y="684" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#34443a">ignores prompt caching.</text>
<line x1="468" y1="674.5" x2="488" y2="674.5" fill="none" stroke="#18291b" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round"><animate attributeName="stroke-dashoffset" from="0" to="-14" dur="0.8s" repeatCount="indefinite"></animate></line>
<path d="M483 670.5 L489 674.5 L483 678.5" fill="none" stroke="#18291b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
<rect x="494" y="621" width="362" height="107" rx="7" fill="#1d4424"></rect>
<path d="M508 638 l3.5 3.5 l7 -8" fill="none" stroke="#9fdb9b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path>
<text x="526" y="643" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.3" fill="#9fdb9b">WITH SL HISTOR</text>
<text x="508" y="665" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">Cost per token type that reconciles to</text><text x="508" y="684" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">the provider invoice; in the demo, the</text><text x="508" y="703" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#fbfaf6">naive estimate was off by 369%.</text>
<rect x="16.8" y="613.8" width="846.4" height="121.4" rx="9.5" fill="none" stroke="#18291b" stroke-width="1.5" stroke-dasharray="6 5"></rect>
</g></svg>