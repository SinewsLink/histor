<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 90 1200 540" width="1200" height="540" role="img" aria-labelledby="t d" lang="fr">
<title id="t">Comment SL Histor transforme les actions des agents en preuves</title><desc id="d">Vos agents d’IA, vos outils MCP et vos API de modèles alimentent SL Histor, qui fonctionne sur vos propres serveurs. Il saisit chaque action, obtient une approbation humaine pour les actions à risque, signe et enchaîne chaque enregistrement, puis les regroupe en lots avec des preuves de Merkle. Résultat : un auditeur peut vérifier la preuve, le coût est rapproché de la facture, la preuve s’exporte en attestations W3C, et la racine du lot est prête à être horodatée publiquement : seule une empreinte quitte vos serveurs.</desc>
<style>
:root{--bg:#0b0c0e;--card:#1c1d20;--hair:#2c2d31;--ink:#f5f5f7;--muted:#a1a1a6;--sig:#7fa6e0;--frame:#6b6c72}
@media (prefers-color-scheme: light){:root{--bg:#ffffff;--card:#ffffff;--hair:#e0e0e0;--ink:#1d1d1f;--muted:#6e6e73;--sig:#3d68a8;--frame:#8a8a8f}}
.bg{fill:var(--bg)}
.card{fill:var(--card);stroke:var(--hair);stroke-width:1}
.frame{fill:none;stroke:var(--frame);stroke-width:1;stroke-dasharray:2 6;stroke-linecap:round}
.t{font:600 20px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:-0.2px;fill:var(--ink)}
.s{font:400 15px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--muted)}
.lab{font:500 12px "Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:1.2px;fill:var(--muted)}
.rail{fill:none;stroke:var(--sig);stroke-opacity:.28;stroke-width:1.5}
.flow{fill:none;stroke:var(--sig);stroke-width:1.5;stroke-dasharray:4 10;stroke-linecap:round;animation:flow 1.1s linear infinite}
.pulse{fill:var(--sig)}
@keyframes flow{to{stroke-dashoffset:-14}}
@media (prefers-reduced-motion: reduce){.flow{animation:none}.pulse{display:none}}
</style>
